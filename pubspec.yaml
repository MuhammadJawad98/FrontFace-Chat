name: frontface_chat
description: Native Flutter SDK for FrontFace AI chat with lead capture and live human agent handoff support.
version: 1.1.0
homepage: https://frontface.app
repository: https://github.com/MuhammadJawad98/FrontFace-Chat
issue_tracker: https://github.com/MuhammadJawad98/FrontFace-Chat/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.27.1"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  package_info_plus: ^8.3.0
  flutter_markdown_plus: ^1.0.11
  url_launcher: ^6.3.2
  realtime_client: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
