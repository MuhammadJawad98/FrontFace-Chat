name: frontface_chat
description: Native Flutter SDK for FrontFace AI chat with lead capture and live human agent handoff support.
version: 1.5.6
homepage: https://frontface.app
repository: https://github.com/MuhammadJawad98/FrontFace-Chat
issue_tracker: https://github.com/MuhammadJawad98/FrontFace-Chat/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.27.1"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.1.5
  shared_preferences: ^2.5.5
  package_info_plus: '>=8.3.0 <10.0.0'
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.2
  realtime_client: ^2.13.0
  permission_handler: '>=11.4.0 <14.0.0'
  image_picker: ^1.2.3
  image_picker_android: ^0.8.13+17
  image_picker_platform_interface: ^2.11.1
  # file_picker 12+ federates to android_file_picker (Flutter ≥3.38) and breaks
  # many host Android release builds — stay on 11.x (monolith, AGP 9-ready).
  file_picker: '>=11.0.0 <12.0.0'
  # 14.0.3 pulls package_info_plus ^10 → win32 ^6, incompatible with file_picker <12.
  geolocator: '>=13.0.4 <14.0.3'
  google_maps_flutter: ^2.18.0
  record: ^6.2.1
  path_provider: ^2.1.6
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: FrontFaceArabic
      fonts:
        - asset: fonts/NotoSansArabic-Regular.ttf
