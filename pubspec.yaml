name: frontface_chat
description: Native Flutter SDK for FrontFace AI chat with lead capture and live human agent handoff support.
version: 1.5.13
homepage: https://frontface.app
repository: https://github.com/MuhammadJawad98/FrontFace-Chat
issue_tracker: https://github.com/MuhammadJawad98/FrontFace-Chat/issues

environment:
  sdk: ^3.8.0
  # Keep below Flutter 3.44 plugins (audioplayers 6.8 / record 7 / image_picker_android 0.8.13+18).
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.1.5
  shared_preferences: ^2.5.5
  package_info_plus: '>=8.3.0 <10.0.0'
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.2
  realtime_client: ^2.13.0
  permission_handler: '>=11.4.0 <14.0.0'
  image_picker: ^1.2.3
  # Cap below 0.8.13+18 (requires Flutter >=3.44 / SDK ^3.12).
  image_picker_android: '>=0.8.13 <=0.8.13+17'
  image_picker_platform_interface: ^2.11.1
  # file_picker 12+ federates to android_file_picker and breaks many host
  # Android release builds — stay on 11.x (monolith, AGP 9-ready).
  file_picker: '>=11.0.0 <12.0.0'
  # 14.0.3 pulls package_info_plus ^10 → win32 ^6, incompatible with file_picker <12.
  geolocator: '>=13.0.4 <14.0.3'
  google_maps_flutter: ^2.18.0
  path_provider: ^2.1.6

  # Voice: stay on the Flutter 3.35–3.43 line so hosts do not need overrides.
  # (6.8+ / platform *.3.0+ / record 7+ require Flutter >=3.44.)
  audioplayers: '>=6.7.0 <6.8.0'
  audioplayers_android: '>=5.2.0 <5.3.0'
  audioplayers_darwin: '>=6.3.0 <6.5.0'
  audioplayers_linux: '>=4.2.0 <4.3.0'
  audioplayers_platform_interface: '>=7.1.0 <7.2.0'
  audioplayers_web: '>=5.1.1 <5.3.0'
  audioplayers_windows: '>=4.2.1 <4.4.0'

  record: '>=6.0.0 <7.0.0'
  record_android: '>=1.5.0 <2.0.0'
  record_ios: '>=1.2.0 <2.0.0'
  record_macos: '>=1.2.0 <2.0.0'
  record_linux: '>=1.3.0 <2.0.0'
  record_web: '>=1.2.0 <2.0.0'
  record_windows: '>=1.0.0 <2.0.0'
  record_platform_interface: '>=1.5.0 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: FrontFaceArabic
      fonts:
        - asset: fonts/NotoSansArabic-Regular.ttf
